spring:
  kafka:
    topic:
      # Requires at least three Kafka brokers. Explicit env overrides are for
      # deliberate single-node deployments, with reduced durability.
      replication-factor: ${SPRING_KAFKA_TOPIC_REPLICATION_FACTOR:3}
      min-insync-replicas: ${SPRING_KAFKA_TOPIC_MIN_INSYNC_REPLICAS:2}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

admin:
  bootstrap:
    enabled: false

app:
  auth:
    registration:
      mode: INVITE_ONLY
      invite-required: true

elasticsearch:
  insecure-trust-all-certificates: false

security:
  allowed-origins: ${SECURITY_ALLOWED_ORIGINS}

logging:
  level:
    org.springframework.web: INFO
    org.springframework.boot.autoconfigure.web.servlet: INFO
    org.springframework.security: INFO
    com.yizhaoqi.intellidoc: INFO
    io.minio: WARN
